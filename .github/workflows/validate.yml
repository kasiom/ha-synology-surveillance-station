name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Home Assistant metadata
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Python and Home Assistant tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_ha_test.txt
      - name: Install test dependencies
        run: python -m pip install --requirement requirements_ha_test.txt
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q custom_components tests
      - name: Test
        run: >-
          pytest
          --cov=custom_components/synology_surveillance_station
          --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
