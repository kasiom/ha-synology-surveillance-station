name: Feature request
description: Suggest a focused, broadly useful improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user need rather than only a proposed button or entity.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Synology API evidence
      description: Link documented endpoints or provide sanitized observations if relevant.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This is not already provided by Home Assistant's official synology_dsm integration.
          required: true
